<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>

    <style>

        body{
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        .box{
            background-color: white;
            width: 350px;
            padding: 30px;
            margin: auto;
            border-radius: 10px;
        }

        h1{
            color: blue;
        }

        input{
            width: 250px;
            padding: 10px;
            font-size: 18px;
        }

        button{
            margin-top: 20px;
            padding: 10px 25px;
            background-color: green;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkgreen;
        }

        #result{
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="box">

<h1>Even Odd Checker</h1>

<input type="number" id="number" placeholder="Enter a number">

<br>

<button onclick="check()">Check</button>

<p id="result"></p>

</div>


<script>

function check()
{

    let num = document.getElementById("number").value;


    if(num % 2 == 0)
    {
        document.getElementById("result").innerHTML = 
        num + " is Even Number";
    }

    else
    {
        document.getElementById("result").innerHTML = 
        num + " is Odd Number";
    }

}

</script>


</body>
</html>
